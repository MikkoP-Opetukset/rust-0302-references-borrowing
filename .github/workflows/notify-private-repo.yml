name: Notify Private Repo of Update
on:
  push:
    branches: [ main ]
jobs:
  dispatch:
    if: github.repository == 'MikkoP-Opetukset/rust-0302-references-borrowing'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          repository: MikkoP-Opetukset/ic00bj79-rust-programming
          event-type: update-submodules
